name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Linux and macOS: each runs its own platform's tests
    # (clipboard-linux.test.ts only on Linux). No E2E here: it needs the app
    # (tests/e2e, tests/release/install-e2e.sh run locally), and
    # install.test.ts skips its install.sh test.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The image downscale (images.test.ts): sips on macOS, ImageMagick on Linux.
      - name: ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
      # The release's minimum (scripts/build.mjs NODE_MIN): the built host's suite runs on it.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: echo "NODE_MIN_BIN=$(command -v node)" >> "$GITHUB_ENV"
      # A clone's Node: it runs the TypeScript itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: node --check the mods
        run: for f in herdr-app/mods/*/*.js; do node --check "$f"; done
      - name: shell syntax
        run: sh -n install.sh && bash -n install/app.sh && bash -n tests/release/install-e2e.sh
      - run: npm run build
      - name: the archive matches SHA256SUMS
        # shasum on macOS, sha256sum on Linux (install.sh uses the same two tools).
        run: cd dist && if [ "$RUNNER_OS" = macOS ]; then shasum -a 256 -c SHA256SUMS; else sha256sum -c SHA256SUMS; fi
      - name: smoke the built host on Node 20
        run: HERDR_CHAT_NODE="$NODE_MIN_BIN" dist/herdr-chat-*/bin/herdr-chat-host --help
      - name: the host suite against the built host, on Node 20
        run: npm run test:built
        env:
          HERDR_CHAT_TEST_NODE: ${{ env.NODE_MIN_BIN }}
